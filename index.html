<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Incident Response &middot; Coming Soon</title>
  <meta name="description" content="Dynamic Incident Response: A Framework for Security Teams, by Joshua Wright. Coming soon.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B365D">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta property="og:title" content="Dynamic Incident Response &middot; Coming Soon">
  <meta property="og:description" content="A Framework for Security Teams, by Joshua Wright. Coming soon.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dynamicincidentresponse.com/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #1B365D;
      --blue: #09456D;
      --cyan: #0076BE;
      --white: #FFFFFF;
      --text-light: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Lora', Georgia, serif;
      color: var(--white);
      background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 60%, #052238 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      line-height: 1.6;
    }

    .wrap {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    .cover {
      display: block;
      margin: 0 auto 2.25rem;
      width: 200px;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .eyebrow {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--cyan);
      margin: 0 0 1rem;
    }

    h1 {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700;
      font-size: clamp(1.9rem, 5vw, 2.75rem);
      line-height: 1.15;
      margin: 0 0 0.6rem;
      color: var(--white);
    }

    .subtitle {
      font-family: 'Lora', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      color: var(--text-light);
      margin: 0 0 2rem;
    }

    .rule {
      width: 60px;
      height: 2px;
      background: var(--cyan);
      border: none;
      margin: 0 auto 2rem;
    }

    .message {
      font-size: 1.05rem;
      color: var(--text-light);
      margin: 0 auto 2.5rem;
      max-width: 520px;
    }

    .byline {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.6);
      margin: 0;
    }

    .byline strong {
      color: rgba(255, 255, 255, 0.85);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .cover { width: 160px; margin-bottom: 1.75rem; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <picture>
      <source srcset="img/cover.webp" type="image/webp">
      <img src="img/cover-560.png" alt="Dynamic Incident Response book cover" class="cover" width="200" height="250">
    </picture>
    <p class="eyebrow">Coming Soon</p>
    <h1>Dynamic Incident Response</h1>
    <p class="subtitle">A Framework for Security Teams</p>
    <hr class="rule">
    <p class="message">
      A practical guide to building and running incident response programs
      that adapt to modern threats. The book and companion resources will
      be available here shortly.
    </p>
    <p class="byline">by <strong>Joshua Wright</strong></p>
  </main>
